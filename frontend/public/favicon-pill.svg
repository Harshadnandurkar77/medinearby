<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pillTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pillBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark glassmorphic background tile -->
  <rect width="64" height="64" rx="18" fill="url(#pillBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="17" stroke="#334155" stroke-width="1"/>

  <!-- Angled Pill / Capsule (rotate -45deg centered at 32,32) -->
  <g transform="rotate(-45 32 32)" filter="url(#glow)">
    <!-- Top Half (Blue) -->
    <path d="M 22 14 A 10 10 0 0 1 42 14 L 42 31 L 22 31 Z" fill="url(#pillTop)"/>
    <!-- Bottom Half (Teal/Emerald) -->
    <path d="M 22 33 L 42 33 L 42 50 A 10 10 0 0 1 22 50 Z" fill="url(#pillBottom)"/>
    <!-- Shine streak -->
    <path d="M 26 14 L 26 48" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
