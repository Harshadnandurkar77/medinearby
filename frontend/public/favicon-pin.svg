    <path d="M32 8C20.954 8 12 16.954 12 28c0 14 18 28 20 29.5a0.8.0 0 0 0 0.9 0C34 56 52 42 52 28c0-11.046-8.954-20-20-20z" fill="url(#pinBg)"/>
    
    <!-- White Medical Cross -->
