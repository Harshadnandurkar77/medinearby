<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pulseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pulseBg)"/>
  <!-- Heartbeat ECG line -->
  <path d="M12 33h10l4-10 6 20 6-15 4 8h10" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Location Pin Dot above pulse peak -->
  <circle cx="32" cy="14" r="4" fill="#6EE7B7"/>
</svg>
