<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container tile with smooth rounded corners -->
  <rect width="64" height="64" rx="18" fill="url(#shieldBg)"/>
  
  <!-- Glowing Shield Motif -->
  <g filter="url(#shieldShadow)">
    <path d="M32 10L15 17.5v13.5c0 11.2 7.2 21.6 17 24.5 9.8-2.9 17-13.3 17-24.5V17.5L32 10z" fill="#FFFFFF" fill-opacity="0.18" stroke="#A5B4FC" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Radiant Cyan & White Medical Cross inside shield -->
    <rect x="27" y="20" width="10" height="20" rx="3" fill="url(#crossGrad)"/>
    <rect x="22" y="25" width="20" height="10" rx="3" fill="url(#crossGrad)"/>
  </g>
</svg>